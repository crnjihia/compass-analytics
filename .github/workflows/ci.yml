name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_MODE: dev
  NEXT_PUBLIC_AUTH_MODE: dev
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_bW9jay1jbGVyay1rZXktZm9yLWNpLWJ1aWxkLXRlc3RzLmNsZXJrLmFjY291bnRzLmRldiQ
  CLERK_SECRET_KEY: sk_test_mock_secret_key_ci_build
  CLERK_WEBHOOK_SECRET: whsec_mock
  DATABASE_URL: postgresql://compass_app:compass_secret@localhost:5432/compass_analytics?sslmode=disable
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/compass_analytics
  REDIS_URL: redis://localhost:6379

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run db:generate

      - name: Run ESLint
        run: pnpm run lint

      - name: Build & Typecheck Monorepo
        run: pnpm run build

  test-monorepo:
    name: Monorepo Tests (Node / Prisma RLS / tRPC)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compass_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo
        run: |
          pnpm run db:generate
          pnpm run build

      - name: Run DB Migrations
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/compass_analytics"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/compass_analytics"
        run: pnpm run db:migrate

      - name: Seed Database
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/compass_analytics"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/compass_analytics"
        run: pnpm run db:seed

      - name: Run Monorepo Vitest Test Suite
        env:
          DATABASE_URL: "postgresql://compass_app:compass_secret@localhost:5432/compass_analytics?sslmode=disable"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/compass_analytics"
          REDIS_URL: "redis://localhost:6379"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_mock"
          CLERK_SECRET_KEY: "sk_test_mock"
          CLERK_WEBHOOK_SECRET: "whsec_mock"
        run: pnpm test

  test-go-ingest:
    name: Go Ingest Service Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compass_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/ingest/go.mod
          cache-dependency-path: services/ingest/go.sum

      - name: Run Go Unit & Integration Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/compass_analytics?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
        working-directory: services/ingest
        run: |
          go vet ./...
          go test -v -race ./...

  validate-k8s:
    name: Validate Kubernetes & Kustomize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Validate Base Manifests
        run: kubectl kustomize deploy/k8s/base > /dev/null

      - name: Validate Staging Overlay
        run: kubectl kustomize deploy/k8s/overlays/staging > /dev/null

      - name: Validate Production Overlay
        run: kubectl kustomize deploy/k8s/overlays/production > /dev/null
