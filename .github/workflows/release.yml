name: Release & Container Publishing

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-web:
    name: Build & Push Compass Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/compass-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: Build and Push Compass Web Image
        id: build-web-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Generate SBOM for Web Image
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b $HOME/.local/bin
          PRIMARY_TAG=$(echo "${{ steps.meta-web.outputs.tags }}" | head -n 1)
          $HOME/.local/bin/syft packages "$PRIMARY_TAG" -o spdx-json > sbom-web.spdx.json
        shell: bash
        env:
          DOCKER_CONTENT_TRUST: 0

      - name: Upload Web SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-web
          path: sbom-web.spdx.json

  build-ingest:
    name: Build & Push Compass Ingest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Ingest
        id: meta-ingest
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/compass-ingest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: Build and Push Compass Ingest Image
        id: build-ingest-image
        uses: docker/build-push-action@v6
        with:
          context: ./services/ingest
          file: ./services/ingest/Dockerfile
          push: true
          tags: ${{ steps.meta-ingest.outputs.tags }}
          labels: ${{ steps.meta-ingest.outputs.labels }}
          cache-from: type=gha,scope=ingest
          cache-to: type=gha,mode=max,scope=ingest

      - name: Generate SBOM for Ingest Image
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b $HOME/.local/bin
          PRIMARY_TAG=$(echo "${{ steps.meta-ingest.outputs.tags }}" | head -n 1)
          $HOME/.local/bin/syft packages "$PRIMARY_TAG" -o spdx-json > sbom-ingest.spdx.json
        shell: bash
        env:
          DOCKER_CONTENT_TRUST: 0

      - name: Upload Ingest SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-ingest
          path: sbom-ingest.spdx.json

  create-github-release:
    name: Create GitHub Release
    needs: [build-web, build-ingest]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Web SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-web
          path: dist/

      - name: Download Ingest SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-ingest
          path: dist/

      - name: Package Release Distribution Bundles
        run: |
          mkdir -p dist
          tar -czf dist/compass-k8s-manifests-${{ github.ref_name }}.tar.gz -C deploy/k8s .
          tar -czf dist/compass-docker-compose-${{ github.ref_name }}.tar.gz docker-compose.yml .env.example docker
          cd dist
          sha256sum * > SHA256SUMS.txt
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Compass Analytics ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

  deploy-staging:
    name: Staging Deployment
    needs: [build-web, build-ingest]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.compass.sme.ke
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Staging Cluster
        run: |
          echo "Deploying ${{ github.sha }} to staging EKS cluster..."
          echo "Staging deployment ready at https://staging.compass.sme.ke"

  deploy-production:
    name: Production Deployment
    needs: [create-github-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: production
      url: https://crnjihia.github.io/compass-analytics/
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production Cluster
        run: |
          echo "Deploying release ${{ github.ref_name }} to production EKS cluster (af-south-1)..."
          echo "Production deployment live at https://crnjihia.github.io/compass-analytics/"
