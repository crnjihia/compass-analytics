name: Release & Container Publishing

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-web:
    name: Build & Push Compass Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/compass-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: Build and Push Compass Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

          - name: Generate SBOM for Web Image
            run: |
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b $HOME/.local/bin
              $HOME/.local/bin/syft packages ${{ steps.meta-web.outputs.tags }} -o spdx-json - > sbom-web.spdx.json
            shell: bash
            env:
              DOCKER_CONTENT_TRUST: 0

          - name: Upload Web SBOM
            uses: actions/upload-artifact@v4
            with:
              name: sbom-web
              path: sbom-web.spdx.json

  build-ingest:
    name: Build & Push Compass Ingest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Ingest
        id: meta-ingest
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/compass-ingest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=sha,format=short

      - name: Build and Push Compass Ingest Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/ingest
          file: ./services/ingest/Dockerfile
          push: true
          tags: ${{ steps.meta-ingest.outputs.tags }}
          labels: ${{ steps.meta-ingest.outputs.labels }}
          cache-from: type=gha,scope=ingest
          cache-to: type=gha,mode=max,scope=ingest

          - name: Generate SBOM for Ingest Image
            run: |
              curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b $HOME/.local/bin
              $HOME/.local/bin/syft packages ${{ steps.meta-ingest.outputs.tags }} -o spdx-json - > sbom-ingest.spdx.json
            shell: bash
            env:
              DOCKER_CONTENT_TRUST: 0

          - name: Upload Ingest SBOM
            uses: actions/upload-artifact@v4
            with:
              name: sbom-ingest
              path: sbom-ingest.spdx.json

  create-github-release:
    name: Create GitHub Release
    needs: [build-web, build-ingest]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Compass Analytics ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
