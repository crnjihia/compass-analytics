apiVersion: apps/v1
kind: Deployment
metadata:
  name: compass-ingest
  namespace: compass
  labels:
    app.kubernetes.io/name: compass-ingest
    app.kubernetes.io/component: ingest
    app.kubernetes.io/part-of: compass
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: compass-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compass-ingest
        app.kubernetes.io/component: ingest
        app.kubernetes.io/part-of: compass
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: compass-ingest
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ingest
          image: ghcr.io/compass/compass-ingest:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          env:
            - name: WORKER_COUNT
              value: "8"
          envFrom:
            - configMapRef:
                name: compass-config
            - secretRef:
                name: compass-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
