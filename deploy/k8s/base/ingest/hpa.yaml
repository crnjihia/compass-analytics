apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: compass-ingest-hpa
  namespace: compass
  labels:
    app.kubernetes.io/name: compass-ingest
    app.kubernetes.io/component: ingest
    app.kubernetes.io/part-of: compass
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: compass-ingest
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
