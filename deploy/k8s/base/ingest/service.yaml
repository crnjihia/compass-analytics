apiVersion: v1
kind: Service
metadata:
  name: compass-ingest
  namespace: compass
  labels:
    app.kubernetes.io/name: compass-ingest
    app.kubernetes.io/component: ingest
    app.kubernetes.io/part-of: compass
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
  selector:
    app.kubernetes.io/name: compass-ingest
