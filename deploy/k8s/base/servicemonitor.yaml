apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: compass-ingest-monitor
  namespace: compass
  labels:
    app.kubernetes.io/name: compass-ingest
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: compass-ingest
  endpoints:
    - port: metrics
      path: /metrics
      interval: 5s
      scrapeTimeout: 3s
