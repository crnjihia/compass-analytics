apiVersion: apps/v1
kind: Deployment
metadata:
  name: compass-web
  namespace: compass
  labels:
    app.kubernetes.io/name: compass-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: compass
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: compass-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: compass-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: compass
    spec:
      serviceAccountName: compass-web
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: web
          image: ghcr.io/compass/compass-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: compass-config
            - secretRef:
                name: compass-secrets
          livenessProbe:
            httpGet:
              path: /api/trpc/health.check
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/trpc/health.check
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
