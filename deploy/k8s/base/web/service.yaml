apiVersion: v1
kind: Service
metadata:
  name: compass-web
  namespace: compass
  labels:
    app.kubernetes.io/name: compass-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: compass
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: compass-web
