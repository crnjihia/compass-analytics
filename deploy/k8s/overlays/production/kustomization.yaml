apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: compass

patches:
  - target:
      kind: Deployment
      name: compass-web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: compass-web
      spec:
        replicas: 3
  - target:
      kind: Deployment
      name: compass-ingest
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: compass-ingest
      spec:
        replicas: 5
  - target:
      kind: ServiceAccount
      name: compass-web
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: compass-web
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/compass-production-workload-irsa
  - target:
      kind: ServiceAccount
      name: compass-ingest
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: compass-ingest
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/compass-production-workload-irsa
  - target:
      kind: Ingress
      name: compass-ingress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: compass-ingress
      spec:
        rules:
          - host: compass.co.ke
            http:
              paths:
                - path: /mpesa
                  pathType: Prefix
                  backend:
                    service:
                      name: compass-ingest
                      port:
                        number: 8080
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: compass-web
                      port:
                        number: 3000

images:
  - name: ghcr.io/compass/compass-web
    newTag: v1.0.0
  - name: ghcr.io/compass/compass-ingest
    newTag: v1.0.0
