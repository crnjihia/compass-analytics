apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: staging-
namespace: compass-staging

patches:
  - target:
      kind: Deployment
      name: compass-web
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: compass-web
      spec:
        replicas: 1
  - target:
      kind: Deployment
      name: compass-ingest
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: compass-ingest
      spec:
        replicas: 1
  - target:
      kind: Ingress
      name: compass-ingress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: compass-ingress
      spec:
        rules:
          - host: staging.compass.co.ke

images:
  - name: ghcr.io/compass/compass-web
    newTag: staging
  - name: ghcr.io/compass/compass-ingest
    newTag: staging
