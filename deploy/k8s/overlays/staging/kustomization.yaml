apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: staging-
namespace: compass-staging

patches:
  - path: patches/replicas.yaml
  - path: patches/ingress.yaml

images:
  - name: ghcr.io/compass/compass-web
    newTag: staging
  - name: ghcr.io/compass/compass-ingest
    newTag: staging
