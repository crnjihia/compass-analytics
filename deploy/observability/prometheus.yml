global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "compass-ingest"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  - job_name: "compass-web"
    metrics_path: "/api/trpc/health.check"
    static_configs:
      - targets: ["host.docker.internal:3000"]
